# Abroadly Express API — free Render web service.
# Prefer Dashboard → New → Web Service (Free) if Blueprint asks for a card.

services:
  - type: web
    name: abroadly-api
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm run start:backend
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - .npmrc
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
